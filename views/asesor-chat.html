<!-- VISTA: ASESOR VIRTUAL (CHAT) -->
<div class="asesor-view">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <button class="btn-back" onclick="window.loadDefaultView && loadDefaultView()">
                <i class="bi bi-arrow-left"></i> Volver al inicio
            </button>
        </div>
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-workspace fs-2 text-warning"></i>
            <div>
                <h2 class="fw-bold mb-0" style="color: #0a2a36;">Asesor Virtual Minero</h2>
                <span class="badge bg-success" style="font-size: 0.7rem;">En línea</span>
            </div>
        </div>
    </div>

    <!-- Contenedor principal del chat -->
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-0">
            <div class="chat-body" id="chatMensajes" style="height: 500px; overflow-y: auto; padding: 1.5rem; background: #f8f9fa; display: flex; flex-direction: column; gap: 1rem;">
                <!-- Mensaje de bienvenida (se inyecta con JS) -->
                <div class="chat-message bot-message">
                    <i class="bi bi-robot me-2"></i>
                    <div class="bubble">
                        ¡Hola! Soy tu asesor especializado en metales y precios.
                        ¿En qué puedo ayudarte hoy? (Ej: Precio del cobre, valorización de concentrados, etc.)
                    </div>
                </div>
            </div>
            
            <!-- Pie del chat (input y botón) -->
            <div class="p-3 border-top bg-white">
                <div class="input-group">
                    <input type="text" id="chatInput" class="form-control" placeholder="Escribe tu consulta..." aria-label="Escribe tu consulta">
                    <button class="btn btn-warning" type="button" id="chatSendBtn">
                        <i class="bi bi-send-fill"></i> Enviar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
